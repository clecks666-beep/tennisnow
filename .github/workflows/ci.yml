name: ci

# Runs the analyzer and the test suite on every push and PR. pages.yml only
# builds + deploys the web app — it never ran the tests, so a regression in the
# pure scoring / skill / progression domain (the community-ready invariant,
# CLAUDE.md §9.5) could ship to the live deploy unseen. This gate catches it.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      # Analyzer and tests import Drift-generated code (*.g.dart); generate it
      # first or analyze reports missing types and the tests fail to compile.
      - run: dart run build_runner build --delete-conflicting-outputs
      # Gate on ERROR/WARNING severity only. Both `flutter analyze` and bare
      # `dart analyze` exit non-zero on info-level issues in this project, so we
      # use the stable machine format (SEVERITY|TYPE|CODE|FILE|LINE|COL|LEN|MSG,
      # severity uppercased, no color/bullets) and fail only on ERROR|/WARNING|
      # lines. Errors include unused_import / unused_local_variable (promoted to
      # error in analysis_options.yaml). The ~88 auto-fixable style infos
      # (prefer_const, require_trailing_commas, …) stay advisory — clear them
      # with `dart fix --apply` in a Flutter-equipped session, then this can
      # tighten to a bare `dart analyze --fatal-infos`.
      - name: Analyze (fail on errors/warnings)
        run: |
          dart analyze --format=machine 2>&1 | tee analyze.txt || true
          if grep -qE '^(ERROR|WARNING)\|' analyze.txt; then
            echo "::error::Analyzer reported error/warning-severity issues — see log"
            exit 1
          fi
      - run: flutter test
