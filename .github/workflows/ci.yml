name: ci

# Runs the analyzer and the test suite on every push and PR. pages.yml only
# builds + deploys the web app — it never ran the tests, so a regression in the
# pure scoring / skill / progression domain (the community-ready invariant,
# CLAUDE.md §9.5) could ship to the live deploy unseen. This gate catches it.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      # Analyzer and tests import Drift-generated code (*.g.dart); generate it
      # first or analyze reports missing types and the tests fail to compile.
      - run: dart run build_runner build --delete-conflicting-outputs
      # Gate on analyzer ERROR-severity issues only — incl. unused_import /
      # unused_local_variable, promoted to error in analysis_options.yaml. The
      # ~88 remaining lint infos (prefer_const, require_trailing_commas, …) are
      # auto-fixable advisory debt: run `dart fix --apply` in a Flutter-equipped
      # session to clear them, then this gate can be tightened to a bare
      # `flutter analyze`. (flutter analyze exits non-zero on infos too, so we
      # key off error-severity lines explicitly rather than its exit code.)
      - name: Analyze (fail on errors only)
        run: |
          flutter analyze 2>&1 | tee analyze.log || true
          if grep -qE '^[[:space:]]*error ' analyze.log; then
            echo "::error::Analyzer reported error-severity issues — see log above"
            exit 1
          fi
      - run: flutter test
