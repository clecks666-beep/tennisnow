name: pages

# Builds the Flutter web app and publishes it to GitHub Pages.
# Requires the repository to be PUBLIC (free GitHub Pages) — see README.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter create . --platforms=web --project-name tennisnow
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Drift needs sqlite3 (WASM) + its worker to run on the web. flutter create
      # does not provide these, so fetch them into web/ before the build (they're
      # forwards-compatible with drift ^2.18). Without them the database can't
      # open and the app can't save or load sessions.
      - name: Add drift web assets (sqlite3.wasm + worker)
        run: |
          curl -fSL -o web/sqlite3.wasm \
            https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.4.6/sqlite3.wasm
          curl -fSL -o web/drift_worker.js \
            https://github.com/simolus3/drift/releases/download/drift-2.18.0/drift_worker.js
      - run: flutter build web --release --base-href /tennisnow/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
